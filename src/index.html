<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
<title>XSD Viewer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
body{display:flex;background:#0F172A}

/* ── SIDEBAR ──────────────────────────────────────────────── */
.sidebar{width:256px;min-width:256px;background:#111827;display:flex;flex-direction:column;border-right:1px solid #1F2937}
.sb-head{padding:14px 14px 12px;border-bottom:1px solid #1F2937;display:flex;align-items:center;gap:10px;flex-shrink:0;
  -webkit-app-region:drag} /* drag window from sidebar header on macOS */
.sb-head *{-webkit-app-region:no-drag}
.sb-logo{width:30px;height:30px;background:#2563EB;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.sb-logo svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb-title{font-size:14px;font-weight:600;color:#F9FAFB;letter-spacing:-.2px}
.sb-sub{font-size:10px;color:#4B5563;margin-top:1px}

.sb-drop-area{padding:10px 12px;border-bottom:1px solid #1F2937;flex-shrink:0}
.sb-dz{border:1.5px dashed #374151;border-radius:8px;padding:14px 10px;text-align:center;cursor:pointer;transition:all .15s}
.sb-dz:hover,.sb-dz.drag{border-color:#3B82F6;background:rgba(30,58,95,.15)}
.sb-dz p{font-size:12px;color:#9CA3AF;margin-bottom:2px}
.sb-dz p span{color:#60A5FA;font-weight:500}
.sb-dz small{font-size:10.5px;color:#4B5563}
.sb-fname{font-size:11px;color:#4B5563;text-align:center;padding:5px 12px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sb-search-wrap{padding:8px 12px;border-bottom:1px solid #1F2937;position:relative;flex-shrink:0}
.sb-search-wrap input{width:100%;background:#1F2937;border:1px solid #374151;border-radius:6px;padding:6px 10px 6px 28px;font-size:12px;color:#F1F5F9;outline:none;font-family:inherit;transition:border-color .15s}
.sb-search-wrap input::placeholder{color:#4B5563}
.sb-search-wrap input:focus{border-color:#3B82F6}
.sb-search-icon{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:#4B5563;font-size:13px;pointer-events:none}

.sb-nav{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#374151 transparent;padding:6px 0}
.sb-section{padding:8px 14px 3px;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#4B5563;display:flex;align-items:center;justify-content:space-between}
.sb-cnt{font-size:10px;background:#1F2937;color:#6B7280;padding:1px 5px;border-radius:4px;font-weight:500}
.sb-item{display:flex;align-items:center;gap:6px;padding:5px 14px;cursor:pointer;font-size:12.5px;color:#9CA3AF;transition:all .1s;white-space:nowrap;overflow:hidden}
.sb-item:hover{background:#1F2937;color:#F1F5F9}
.sb-item.active{background:#1E3A5F;color:#60A5FA}
.sb-item-icon{font-size:10px;flex-shrink:0}
.sb-item-name{overflow:hidden;text-overflow:ellipsis;flex:1}
.sb-item-badge{font-size:9px;background:#1F2937;color:#6B7280;padding:1px 5px;border-radius:3px;flex-shrink:0;font-family:monospace}

.sb-footer{padding:9px 12px;border-top:1px solid #1F2937;display:flex;gap:6px;flex-shrink:0}
.sb-btn{flex:1;padding:5px;border-radius:6px;border:1px solid #374151;background:transparent;color:#9CA3AF;font-size:11.5px;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center}
.sb-btn:hover{background:#1F2937;color:#E5E7EB;border-color:#4B5563}

/* ── MAIN ──────────────────────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.toolbar{display:flex;align-items:center;gap:8px;padding:7px 14px;background:#fff;border-bottom:1px solid #E2E8F0;flex-shrink:0;min-height:43px;-webkit-app-region:drag}
.toolbar *{-webkit-app-region:no-drag}
.tb-left{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden}
.breadcrumb{display:flex;align-items:center;gap:5px;font-size:13px;min-width:0;overflow:hidden}
.bc-icon{color:#3B82F6;flex-shrink:0}
.bc-name{font-weight:600;color:#0F172A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-sep{color:#94A3B8;font-size:11px;flex-shrink:0}
.bc-sub{color:#64748B;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:5px;flex-shrink:0}
.tb-btn{padding:4px 10px;border-radius:6px;border:1px solid #E2E8F0;background:#fff;font-size:12px;color:#64748B;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.tb-btn:hover{color:#0F172A;border-color:#94A3B8;background:#F8FAFC}
.tb-btn.on{background:#EFF6FF;color:#2563EB;border-color:#BFDBFE}
.tb-divider{width:1px;height:18px;background:#E2E8F0}
.zoom-val{font-size:11px;color:#64748B;min-width:36px;text-align:center;font-family:monospace}

/* ── CANVAS ────────────────────────────────────────────────── */
.canvas-wrap{flex:1;overflow:hidden;position:relative;background:#F1F5F9;
  background-image:radial-gradient(circle,#CBD5E1 1px,transparent 1px);background-size:20px 20px}
#dsvg{width:100%;height:100%;cursor:grab;user-select:none;-webkit-user-select:none}
#dsvg.dragging{cursor:grabbing}

.empty-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.empty-ov.hidden{display:none}
.empty-icon{font-size:52px;opacity:.18}
.empty-h{font-size:17px;font-weight:600;color:#334155}
.empty-p{font-size:13px;color:#64748B}
.sample-btn{margin-top:6px;padding:8px 20px;border-radius:8px;background:#2563EB;color:#fff;border:none;font-size:13px;font-family:inherit;font-weight:500;cursor:pointer}
.sample-btn:hover{background:#1D4ED8}

/* ── STATUSBAR ─────────────────────────────────────────────── */
.statusbar{padding:4px 14px;background:#fff;border-top:1px solid #E2E8F0;font-size:11px;color:#94A3B8;font-family:monospace;display:flex;gap:12px;align-items:center;flex-shrink:0}
.sdot{width:5px;height:5px;border-radius:50%;background:#10B981;flex-shrink:0}
.sdot.err{background:#EF4444}
.sdot.idle{background:#94A3B8}

/* ── TOOLTIP ───────────────────────────────────────────────── */
#tt{position:absolute;background:#1E293B;color:#F1F5F9;padding:7px 11px;border-radius:7px;font-size:11.5px;font-family:monospace;pointer-events:none;opacity:0;transition:opacity .12s;z-index:100;max-width:300px;white-space:pre;line-height:1.65;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#tt.vis{opacity:1}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sb-head">
    <div class="sb-logo">
      <svg viewBox="0 0 16 16"><polyline points="1 4 1 1 15 1 15 4"/><line x1="8" y1="1" x2="8" y2="15"/><line x1="5" y1="15" x2="11" y2="15"/></svg>
    </div>
    <div><div class="sb-title">XSD Viewer</div><div class="sb-sub">Schema diagram</div></div>
  </div>

  <div class="sb-drop-area">
    <div class="sb-dz" id="sb-dz" onclick="nativeOpen()">
      <p><span>Click to open</span> or drop .xsd</p>
      <small>XML Schema document</small>
    </div>
    <div class="sb-fname" id="sb-fname">No file loaded</div>
  </div>

  <div class="sb-search-wrap">
    <span class="sb-search-icon">⌕</span>
    <input type="text" id="search-in" placeholder="Filter types, elements…" oninput="filterNav(this.value)">
  </div>

  <div class="sb-nav" id="sb-nav">
    <div style="padding:24px 14px;font-size:12px;color:#4B5563;text-align:center;line-height:1.8">
      Open an XSD file<br>or load the sample schema
    </div>
  </div>

  <div class="sb-footer">
    <button class="sb-btn" onclick="nativeOpen()">Open File…</button>
    <button class="sb-btn" onclick="loadSample()">Sample</button>
  </div>
</div>

<div class="main">
  <div class="toolbar">
    <div class="tb-left">
      <div class="breadcrumb" id="bc">
        <span style="font-size:13px;color:#94A3B8">No schema loaded</span>
      </div>
    </div>
    <div class="tb-right">
      <button class="tb-btn on" id="btn-attrs" onclick="toggleAttrs()">@ Attrs</button>
      <div class="tb-divider"></div>
      <button class="tb-btn" onclick="expandAll()">Expand all</button>
      <button class="tb-btn" onclick="collapseAll()">Collapse all</button>
      <div class="tb-divider"></div>
      <button class="tb-btn" onclick="zoomOut()">−</button>
      <span class="zoom-val" id="zoom-val">100%</span>
      <button class="tb-btn" onclick="zoomIn()">+</button>
      <button class="tb-btn" onclick="fitView()">⊞ Fit</button>
    </div>
  </div>

  <div class="canvas-wrap" id="cw">
    <svg id="dsvg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="sf" x="-8%" y="-15%" width="120%" height="140%">
          <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#94A3B8" flood-opacity=".16"/>
        </filter>
      </defs>
      <g id="dg"></g>
    </svg>
    <div class="empty-ov" id="empty-ov">
      <div class="empty-icon">⬡</div>
      <div class="empty-h">No schema loaded</div>
      <div class="empty-p">Open an XSD file via File menu (Ctrl+O) or drop it here</div>
      <button class="sample-btn" onclick="loadSample()">Load sample schema</button>
    </div>
  </div>

  <div class="statusbar">
    <div class="sdot idle" id="sdot"></div>
    <span id="sbar">Ready</span>
  </div>
</div>

<div id="tt"></div>

<script>
'use strict';

// ── LAYOUT CONSTANTS ─────────────────────────────────────────
const BW=188,BH=46,AH=30,HGAP=52,VGAP=14,CW=28,CH=28;

// ── STATE ────────────────────────────────────────────────────
const S={schema:null,currentRoot:null,showAttrs:true,tx:40,ty:40,sc:1,dragging:false,dsx:0,dsy:0,dtx:0,dty:0,navItems:[]};
let NC=0,_CT,_ST,_GR,_AG,_VI;
const $=id=>document.getElementById(id);
const esc=s=>s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';

// ── ELECTRON API ─────────────────────────────────────────────
const api = window.electronAPI;

// Wire up IPC from main process
if (api) {
  api.onFileOpen(({ content, fileName }) => loadXSD(content, fileName));
  api.onMenu(ch => {
    const map = {
      'menu:sample':       loadSample,
      'menu:toggle-attrs': toggleAttrs,
      'menu:expand-all':   expandAll,
      'menu:collapse-all': collapseAll,
      'menu:fit':          fitView,
      'menu:zoom-in':      zoomIn,
      'menu:zoom-out':     zoomOut,
      'menu:zoom-reset':   () => { S.sc=1; S.tx=40; S.ty=40; applyTx(); },
    };
    if (map[ch]) map[ch]();
  });
}

function nativeOpen() {
  if (api) api.openFile();
}

// ── XSD PARSER ───────────────────────────────────────────────
function kids(el,n){return Array.from(el.children).filter(c=>c.localName===n);}
function strip(n){if(!n)return n;const i=n.indexOf(':');return i>=0?n.slice(i+1):n;}
function stLabel(st){
  if(!st)return null;
  const r=kids(st,'restriction')[0];
  if(r){const e=kids(r,'enumeration');if(e.length)return'enum('+e.slice(0,3).map(x=>x.getAttribute('value')).join('|')+(e.length>3?'…':'')+')';if(kids(r,'pattern')[0])return'pattern';return strip(r.getAttribute('base')||'xs:string');}
  const li=kids(st,'list')[0];if(li)return'list<'+strip(li.getAttribute('itemType')||'?')+'>';
  const un=kids(st,'union')[0];if(un)return'union';return null;
}
function buildAttr(a){
  const name=a.getAttribute('name')||a.getAttribute('ref')||'?';
  const type=a.getAttribute('type'),use=a.getAttribute('use')||'optional',def=a.getAttribute('default'),fix=a.getAttribute('fixed');
  const inSt=kids(a,'simpleType')[0];
  return{kind:'attr',name,type:type?strip(type):(inSt?stLabel(inSt):null),use,default:def,fixed:fix,id:'n'+(NC++)};
}
function buildEl(el,depth){
  const name=el.getAttribute('name'),ref=el.getAttribute('ref'),typeName=el.getAttribute('type');
  const node={kind:'element',name:name||strip(ref||'?'),type:typeName?strip(typeName):null,
    minO:el.getAttribute('minOccurs'),maxO:el.getAttribute('maxOccurs'),
    isRef:!!ref,nillable:el.getAttribute('nillable')==='true',
    default:el.getAttribute('default'),fixed:el.getAttribute('fixed'),
    children:[],attributes:[],compositor:null,extends:null,extendsKind:null,expanded:depth<2,id:'n'+(NC++)};
  const ic=kids(el,'complexType')[0],is=kids(el,'simpleType')[0];
  if(ic)processComplex(ic,node,depth);
  else if(is)node.type=stLabel(is)||'(simpleType)';
  else if(typeName){const tn=strip(typeName);
    if(_CT.has(tn)&&!_VI.has(tn)){_VI.add(tn);processComplex(_CT.get(tn),node,depth);_VI.delete(tn);}
    else if(_ST.has(tn)){const l=stLabel(_ST.get(tn));if(l)node.type=l;}}
  return node;
}
function processComplex(ct,node,depth){
  let cont=ct;
  const cc=kids(ct,'complexContent')[0],sc=kids(ct,'simpleContent')[0];
  if(cc){const ex=kids(cc,'extension')[0]||kids(cc,'restriction')[0];if(ex){const b=ex.getAttribute('base');if(b){node.extends=strip(b);node.extendsKind=ex.localName==='extension'?'extends':'restricts';}cont=ex;}}
  else if(sc){const ex=kids(sc,'extension')[0]||kids(sc,'restriction')[0];if(ex){const b=ex.getAttribute('base');if(b)node.type=strip(b);cont=ex;}}
  processCompositor(cont,node,depth);collectAttrs(cont,node);if(cont!==ct)collectAttrs(ct,node);
}
function collectAttrs(el,node){
  kids(el,'attribute').forEach(a=>node.attributes.push(buildAttr(a)));
  kids(el,'attributeGroup').forEach(ag=>{const ref=ag.getAttribute('ref');if(!ref)return;const grp=_AG.get(strip(ref));if(grp)kids(grp,'attribute').forEach(a=>node.attributes.push(buildAttr(a)));});
}
function processCompositor(parent,node,depth){
  const COMPS=['sequence','choice','all'];
  const comp=COMPS.map(n=>kids(parent,n)[0]).find(Boolean);if(!comp)return;
  node.compositor=comp.localName;
  kids(comp,'element').forEach(e=>node.children.push(buildEl(e,depth+1)));
  COMPS.forEach(cn=>kids(comp,cn).forEach(nc=>{
    const nn={kind:'compositor',name:nc.localName,minO:nc.getAttribute('minOccurs'),maxO:nc.getAttribute('maxOccurs'),children:[],attributes:[],compositor:nc.localName,expanded:true,id:'n'+(NC++)};
    kids(nc,'element').forEach(e=>nn.children.push(buildEl(e,depth+2)));node.children.push(nn);
  }));
  kids(comp,'group').forEach(g=>{const ref=g.getAttribute('ref');if(!ref)return;
    const gn={kind:'group',name:strip(ref),minO:g.getAttribute('minOccurs'),maxO:g.getAttribute('maxOccurs'),children:[],attributes:[],compositor:null,expanded:true,id:'n'+(NC++)};
    const gd=_GR.get(strip(ref));if(gd)processCompositor(gd,gn,depth+1);node.children.push(gn);
  });
  kids(comp,'any').forEach(any=>node.children.push({kind:'any',name:'*',ns:any.getAttribute('namespace')||'##any',minO:any.getAttribute('minOccurs'),maxO:any.getAttribute('maxOccurs'),children:[],attributes:[],expanded:false,id:'n'+(NC++)}));
}
function parseXSD(xml){
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  const pe=doc.querySelector('parsererror');if(pe)throw new Error('XML error: '+pe.textContent.replace(/\s+/g,' ').slice(0,100));
  const schema=doc.documentElement;if(schema.localName!=='schema')throw new Error('Root must be xs:schema');
  _CT=new Map();_ST=new Map();_GR=new Map();_AG=new Map();_VI=new Set();NC=0;
  kids(schema,'complexType').forEach(n=>{if(n.getAttribute('name'))_CT.set(n.getAttribute('name'),n);});
  kids(schema,'simpleType').forEach(n=>{if(n.getAttribute('name'))_ST.set(n.getAttribute('name'),n);});
  kids(schema,'group').forEach(n=>{if(n.getAttribute('name'))_GR.set(n.getAttribute('name'),n);});
  kids(schema,'attributeGroup').forEach(n=>{if(n.getAttribute('name'))_AG.set(n.getAttribute('name'),n);});
  const roots=kids(schema,'element').map(e=>buildEl(e,0));
  return{roots,ctNames:[..._CT.keys()],stNames:[..._ST.keys()],
    ns:schema.getAttribute('targetNamespace'),ver:schema.getAttribute('version'),
    elC:kids(schema,'element').length,ctC:_CT.size,stC:_ST.size};
}

// ── LAYOUT ───────────────────────────────────────────────────
function subtreeH(node,sa){
  if(!node.expanded)return BH;
  const hk=node.children.length>0,ha=sa&&node.attributes.length>0;
  if(!hk&&!ha)return BH;
  let childH=hk?node.children.reduce((s,c,i)=>s+subtreeH(c,sa)+(i>0?VGAP:0),0):0;
  let atH=ha?(node.attributes.length*(AH+4)-4+(hk?VGAP:0)):0;
  return Math.max(BH,childH+atH);
}
function layoutNode(node,x,y,sa){
  const sh=subtreeH(node,sa);node._sh=sh;
  node.bx=x;node.by=y+Math.max(0,(sh-BH)/2);
  if(!node.expanded)return;
  const hk=node.children.length>0,ha=sa&&node.attributes.length>0;
  if(!hk&&!ha)return;
  const compX=x+BW+Math.round(HGAP*.5);
  const childX=compX+CW+Math.round(HGAP*.5);
  node.compX=compX;node.compCY=y+sh/2;
  let cy=y;
  for(const c of node.children){layoutNode(c,childX,cy,sa);cy+=subtreeH(c,sa)+VGAP;}
  if(ha){if(hk)cy+=Math.round(VGAP*.5);for(const a of node.attributes){a.bx=childX;a.by=cy;a._sh=AH;cy+=AH+4;}}
}
function maxRight(n){
  if(!n.expanded||!n.children.length)return n.bx+BW;
  return Math.max(...n.children.map(c=>maxRight(c)));
}

// ── SVG HELPERS ──────────────────────────────────────────────
const NS='http://www.w3.org/2000/svg';
function se(tag,attrs){const el=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);return el;}
function st(txt,attrs){const el=se('text',attrs);el.textContent=txt;return el;}
function sline(x1,y1,x2,y2,color,w,dash){return se('line',{x1,y1,x2,y2,stroke:color,'stroke-width':w||1.5,'stroke-dasharray':dash||'none',fill:'none','stroke-linecap':'round'});}

// ── RENDERER ─────────────────────────────────────────────────
const CC={sequence:{bg:'#EFF6FF',brd:'#BFDBFE',tc:'#1D4ED8',lbl:'S'},choice:{bg:'#FFFBEB',brd:'#FDE68A',tc:'#B45309',lbl:'C'},all:{bg:'#F0FDF4',brd:'#BBF7D0',tc:'#15803D',lbl:'A'}};
function occLabel(a,b){a=a??'1';b=b??'1';if(a==='1'&&b==='1')return'';if(a==='0'&&b==='1')return'?';if(a==='0'&&b==='unbounded')return'*';if(a==='1'&&b==='unbounded')return'+';if(b==='unbounded')return a+'..*';return a+'..'+b;}
function isOpt(n){return n.minO==='0';}

function renderNode(node,g){
  if(!node.expanded){drawBox(node,g);return;}
  const sa=S.showAttrs;
  const items=[...node.children,...(sa?node.attributes:[])].filter(c=>c.bx!==undefined);
  if(items.length){
    const cx=node.compX,cy=node.compCY;
    const cc=CC[node.compositor]||CC.sequence;
    g.appendChild(sline(node.bx+BW,node.by+BH/2,cx,cy,'#CBD5E1',1.5));
    const cg=se('g',{});
    cg.appendChild(se('rect',{x:cx,y:cy-CH/2,width:CW,height:CH,rx:6,fill:cc.bg,stroke:cc.brd,'stroke-width':'1.2'}));
    cg.appendChild(st(cc.lbl,{x:cx+CW/2,y:cy+.5,'text-anchor':'middle','dominant-baseline':'middle','font-size':'10','font-weight':'700',fill:cc.tc,'font-family':'system-ui,sans-serif'}));
    g.appendChild(cg);
    const topCY=items[0].kind==='attr'?items[0].by+AH/2:items[0].by+BH/2;
    const last=items[items.length-1];
    const botCY=last.kind==='attr'?last.by+AH/2:last.by+BH/2;
    if(Math.abs(topCY-botCY)>1)g.appendChild(sline(cx+CW/2,topCY,cx+CW/2,botCY,'#CBD5E1',1.2));
    for(const item of items){
      const isA=item.kind==='attr';
      const itemCY=isA?item.by+AH/2:item.by+BH/2;
      g.appendChild(sline(cx+CW,itemCY,item.bx,itemCY,isA?'#C4B5FD':'#CBD5E1',isA?1:1.5,isOpt(item)?'5 3':'none'));
      if(!isA){const occ=occLabel(item.minO,item.maxO);if(occ)g.appendChild(st(occ,{x:item.bx-4,y:itemCY-3,'text-anchor':'end','font-size':'9.5',fill:'#94A3B8','font-family':'monospace'}));}
    }
  }
  drawBox(node,g);
  for(const c of node.children)renderNode(c,g);
  if(S.showAttrs)for(const a of node.attributes){if(a.bx!==undefined)drawAttrBox(a,g);}
}
function drawBox(node,g){
  const hk=node.children.length>0,ha=S.showAttrs&&node.attributes.length>0;
  const hasKids=hk||ha;
  let stroke='#3B82F6',bg='#FFFFFF';
  if(node.kind==='compositor'){stroke='#6B7280';bg='#F8FAFC';}
  if(node.kind==='group'){stroke='#7C3AED';bg='#FAFAFF';}
  if(node.kind==='any'){stroke='#9CA3AF';bg='#F9FAFB';}
  const{bx,by}=node;
  const ng=se('g',{class:'dn',cursor:hasKids?'pointer':'default'});
  ng.addEventListener('click',e=>{e.stopPropagation();if(hasKids){node.expanded=!node.expanded;render();}});
  ng.addEventListener('mouseenter',e=>showTT(e,node));
  ng.addEventListener('mouseleave',hideTT);
  ng.appendChild(se('rect',{x:bx+1,y:by+2,width:BW,height:BH,rx:6,fill:'rgba(15,23,42,.06)'}));
  const opt=isOpt(node)&&node.kind!=='compositor';
  ng.appendChild(se('rect',{x:bx,y:by,width:BW,height:BH,rx:6,fill:bg,stroke,'stroke-width':'1.6','stroke-dasharray':opt?'6 3.5':'none',filter:'url(#sf)'}));
  if(node.kind==='element'&&!opt)ng.appendChild(se('rect',{x:bx,y:by+6,width:3,height:BH-12,rx:1.5,fill:stroke,opacity:'.55'}));
  const icons={element:'◈',compositor:'#',group:'⬡',any:'✱'};
  const iColors={element:stroke,compositor:'#9CA3AF',group:'#7C3AED',any:'#9CA3AF'};
  ng.appendChild(st(icons[node.kind]||'◈',{x:bx+12,y:by+BH/2,'dominant-baseline':'middle','font-size':'12',fill:iColors[node.kind]||stroke,'font-family':'system-ui,sans-serif'}));
  const hasType=!!(node.type||node.extends);
  const ny=hasType?by+14:by+BH/2;
  const dn=node.name.length>21?node.name.slice(0,20)+'…':node.name;
  ng.appendChild(st(dn,{x:bx+26,y:ny+1,'dominant-baseline':hasType?'auto':'middle','font-size':'12.5','font-weight':'600',fill:'#0F172A','font-family':'system-ui,sans-serif'}));
  if(hasType){
    const ts=node.extends?(node.extendsKind+' '+node.extends):node.type;
    ng.appendChild(st((ts.length>24?ts.slice(0,23)+'…':ts),{x:bx+26,y:by+BH-10,'font-size':'10.5','font-style':'italic',fill:node.extends?'#7C3AED':'#64748B','font-family':'system-ui,sans-serif'}));
  }
  if(hasKids)ng.appendChild(st(node.expanded?'▾':'▸',{x:bx+BW-11,y:by+BH/2,'dominant-baseline':'middle','text-anchor':'middle','font-size':'9',fill:'#94A3B8','font-family':'system-ui,sans-serif'}));
  g.appendChild(ng);
}
function drawAttrBox(attr,g){
  const{bx,by}=attr;
  const ag=se('g',{class:'da',cursor:'default'});
  ag.addEventListener('mouseenter',e=>showAttrTT(e,attr));
  ag.addEventListener('mouseleave',hideTT);
  ag.appendChild(se('rect',{x:bx+1,y:by+1,width:BW,height:AH,rx:5,fill:'rgba(15,23,42,.04)'}));
  const isReq=attr.use==='required';
  ag.appendChild(se('rect',{x:bx,y:by,width:BW,height:AH,rx:5,fill:'#FAFAFF',stroke:'#8B5CF6','stroke-width':'1.2','stroke-dasharray':isReq?'none':'4 2.5'}));
  ag.appendChild(st('@',{x:bx+10,y:by+AH/2+.5,'dominant-baseline':'middle','font-size':'12','font-weight':'700',fill:'#8B5CF6','font-family':'system-ui,sans-serif'}));
  ag.appendChild(st(attr.name,{x:bx+23,y:by+AH/2+.5,'dominant-baseline':'middle','font-size':'11.5','font-weight':'500',fill:'#1E293B','font-family':'system-ui,sans-serif'}));
  const tx2=isReq?bx+BW-38:bx+BW-7;
  if(attr.type)ag.appendChild(st(attr.type.slice(0,16),{x:tx2,y:by+AH/2+.5,'text-anchor':'end','dominant-baseline':'middle','font-size':'10','font-style':'italic',fill:'#94A3B8','font-family':'monospace'}));
  if(isReq){ag.appendChild(se('rect',{x:bx+BW-33,y:by+4,width:27,height:14,rx:3,fill:'#FEF2F2',stroke:'#FECACA','stroke-width':'.8'}));ag.appendChild(st('req',{x:bx+BW-19.5,y:by+11,'text-anchor':'middle','dominant-baseline':'middle','font-size':'8.5','font-weight':'600',fill:'#DC2626','font-family':'system-ui,sans-serif'}));}
  g.appendChild(ag);
}

// ── DIAGRAM CONTROL ──────────────────────────────────────────
function render(){
  const g=$('dg');g.innerHTML='';if(!S.currentRoot)return;
  layoutNode(S.currentRoot,40,40,S.showAttrs);
  renderNode(S.currentRoot,g);applyTx();
}
function applyTx(){$('dg').setAttribute('transform','translate('+S.tx+','+S.ty+') scale('+S.sc+')');$('zoom-val').textContent=Math.round(S.sc*100)+'%';}
function toggleAttrs(){S.showAttrs=!S.showAttrs;$('btn-attrs').classList.toggle('on',S.showAttrs);render();}
function expandAll(){walkAll(S.currentRoot,n=>n.expanded=true);render();}
function collapseAll(){walkAll(S.currentRoot,n=>{if(n!==S.currentRoot)n.expanded=false;});render();}
function walkAll(n,fn){if(!n)return;fn(n);n.children.forEach(c=>walkAll(c,fn));}
function zoomIn(){S.sc=Math.min(4,S.sc*1.18);applyTx();}
function zoomOut(){S.sc=Math.max(.1,S.sc/1.18);applyTx();}
function fitView(){
  if(!S.currentRoot)return;
  const cw=$('cw'),w=cw.clientWidth,h=cw.clientHeight;
  const dw=maxRight(S.currentRoot)-40+60,dh=(S.currentRoot._sh||BH)+80;
  S.sc=Math.min((w-40)/dw,(h-40)/dh,1.6);S.tx=30;S.ty=30;applyTx();
}

// ── PAN & ZOOM ───────────────────────────────────────────────
const dsvg=$('dsvg');
dsvg.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=$('cw').getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const d=e.deltaY>0?.86:1.16,ns=Math.max(.1,Math.min(4,S.sc*d));
  S.tx=mx-(mx-S.tx)*(ns/S.sc);S.ty=my-(my-S.ty)*(ns/S.sc);S.sc=ns;applyTx();
},{passive:false});
dsvg.addEventListener('mousedown',e=>{if(e.button!==0)return;S.dragging=true;S.dsx=e.clientX;S.dsy=e.clientY;S.dtx=S.tx;S.dty=S.ty;dsvg.classList.add('dragging');});
window.addEventListener('mousemove',e=>{if(!S.dragging)return;S.tx=S.dtx+(e.clientX-S.dsx);S.ty=S.dty+(e.clientY-S.dsy);applyTx();});
window.addEventListener('mouseup',()=>{S.dragging=false;dsvg.classList.remove('dragging');});

// Drag-drop file onto canvas
const cw=$('cw');
cw.addEventListener('dragover',e=>{e.preventDefault();cw.style.outline='2px solid #3B82F6';});
cw.addEventListener('dragleave',()=>cw.style.outline='');
cw.addEventListener('drop',e=>{
  e.preventDefault();cw.style.outline='';
  const f=e.dataTransfer.files[0];if(!f)return;
  const reader=new FileReader();reader.onload=ev=>loadXSD(ev.target.result,f.name);reader.readAsText(f);
});

// ── TOOLTIP ──────────────────────────────────────────────────
const TT=$('tt');
function showTT(e,node){
  const p=[];
  if(node.kind==='element')p.push('element    '+node.name);else if(node.kind==='compositor')p.push('compositor '+node.name);else if(node.kind==='group')p.push('group      '+node.name);
  if(node.type)p.push('type       '+node.type);if(node.extends)p.push(node.extendsKind+'   '+node.extends);
  const occ=occLabel(node.minO,node.maxO);if(occ)p.push('occurs     '+occ);
  if(node.nillable)p.push('nillable');if(node.default)p.push('default    '+node.default);
  if(!p.length)return;TT.textContent=p.join('\n');posTT(e);TT.classList.add('vis');
}
function showAttrTT(e,a){
  const p=['attribute  '+a.name];if(a.type)p.push('type       '+a.type);if(a.use)p.push('use        '+a.use);if(a.default)p.push('default    '+a.default);if(a.fixed)p.push('fixed      '+a.fixed);
  TT.textContent=p.join('\n');posTT(e);TT.classList.add('vis');
}
function posTT(e){const r=$('cw').getBoundingClientRect();let x=e.clientX-r.left+14,y=e.clientY-r.top+14;if(x+220>r.width)x-=240;if(y+100>r.height)y-=110;TT.style.left=x+'px';TT.style.top=y+'px';}
function hideTT(){TT.classList.remove('vis');}

// ── SIDEBAR NAV ──────────────────────────────────────────────
function buildNav(schema){
  S.navItems=[];const nav=$('sb-nav');let html='';
  if(schema.roots.length){html+='<div class="sb-section">Root elements <span class="sb-cnt">'+schema.roots.length+'</span></div>';schema.roots.forEach(r=>{S.navItems.push({label:r.name,kind:'root',node:r});html+='<div class="sb-item" data-idx="'+(S.navItems.length-1)+'"><span class="sb-item-icon" style="color:#3B82F6">◈</span><span class="sb-item-name">'+esc(r.name)+'</span></div>';});}
  if(schema.ctNames.length){html+='<div class="sb-section">Complex types <span class="sb-cnt">'+schema.ctNames.length+'</span></div>';schema.ctNames.forEach(n=>{S.navItems.push({label:n,kind:'ct',ctName:n});html+='<div class="sb-item" data-idx="'+(S.navItems.length-1)+'"><span class="sb-item-icon" style="color:#7C3AED">⬡</span><span class="sb-item-name">'+esc(n)+'</span><span class="sb-item-badge">CT</span></div>';});}
  if(schema.stNames.length){html+='<div class="sb-section">Simple types <span class="sb-cnt">'+schema.stNames.length+'</span></div>';schema.stNames.forEach(n=>{S.navItems.push({label:n,kind:'st',stName:n});html+='<div class="sb-item" data-idx="'+(S.navItems.length-1)+'"><span class="sb-item-icon" style="color:#0891B2">◇</span><span class="sb-item-name">'+esc(n)+'</span><span class="sb-item-badge">ST</span></div>';});}
  nav.innerHTML=html;
  nav.querySelectorAll('.sb-item').forEach(el=>{el.addEventListener('click',()=>{nav.querySelectorAll('.sb-item').forEach(e=>e.classList.remove('active'));el.classList.add('active');selectNav(parseInt(el.dataset.idx));});});
}
function selectNav(idx){
  const item=S.navItems[idx];if(!item)return;
  if(item.kind==='root'){setRoot(item.node,item.label,S.schema.ns);}
  else if(item.kind==='ct'){
    const ctDef=_CT.get(item.ctName);if(!ctDef)return;
    NC=10000;_VI=new Set();
    const virt={kind:'element',name:item.ctName,type:null,minO:null,maxO:null,isRef:false,nillable:false,default:null,fixed:null,children:[],attributes:[],compositor:null,extends:null,extendsKind:null,expanded:true,id:'n'+(NC++)};
    processComplex(ctDef,virt,0);setRoot(virt,item.ctName,'Complex type');
  }
}
function setRoot(node,label,sub){
  S.currentRoot=node;S.tx=40;S.ty=40;S.sc=1;
  $('bc').innerHTML='<span class="bc-icon">◈</span><span class="bc-name">'+esc(label)+'</span>'+(sub?'<span class="bc-sep">›</span><span class="bc-sub">'+esc(sub)+'</span>':'');
  $('empty-ov').classList.add('hidden');render();
}
function filterNav(q){const lq=q.toLowerCase();$('sb-nav').querySelectorAll('.sb-item').forEach(el=>{el.style.display=el.textContent.toLowerCase().includes(lq)?'':'none';});}

// ── LOAD XSD ─────────────────────────────────────────────────
function loadXSD(xml,fname){
  try{
    const schema=parseXSD(xml);S.schema=schema;buildNav(schema);
    $('sdot').className='sdot';
    $('sbar').textContent=schema.elC+' element'+(schema.elC!==1?'s':'')+' · '+schema.ctC+' complex type'+(schema.ctC!==1?'s':'')+' · '+schema.stC+' simple type'+(schema.stC!==1?'s':'')+(schema.ns?' · '+schema.ns:'')+(schema.ver?' · v'+schema.ver:'');
    if(fname){$('sb-fname').textContent=fname;if(api)api.setTitle('XSD Viewer — '+fname);}
    const first=$('sb-nav').querySelector('.sb-item');if(first){first.classList.add('active');selectNav(0);}
  }catch(e){$('sdot').className='sdot err';$('sbar').textContent='Error: '+e.message;alert('Parse error:\n'+e.message);}
}
