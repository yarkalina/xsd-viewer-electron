name: Build Release

on:
  push:
    branches:
      - 'release/**'   # triggers on release/x.x.x branches only — NOT main/master

jobs:
  # ── JOB 1: build on each platform ─────────────────────────────────────────
  build:
    strategy:
      fail-fast: false   # let both platforms finish even if one fails
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact_name: xsd-viewer-windows
          - os: macos-latest
            label: macOS
            artifact_name: xsd-viewer-macos

    name: Build — ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Windows ─────────────────────────────────────────────────────────────
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── macOS ───────────────────────────────────────────────────────────────
      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false   # no code signing

      # ── Upload to GitHub Actions Artifact storage ──────────────────────────
      # Artifacts visible at:
      #   Actions tab → pick a run → Artifacts section
      # Also accessible via REST API:
      #   GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 90
